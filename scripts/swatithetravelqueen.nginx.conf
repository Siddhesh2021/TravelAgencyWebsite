# Swati The Travel Queen
# Static Vite SPA. Nginx serves the built bundle directly; no Node process
# sits in the request path.
#
# This vhost previously existed on port 80 only. Because it had no matching
# `listen 443` block, HTTPS requests for this hostname fell through to the
# first-loaded 443 server (sid.sagarkapasi.com) and were proxied to the
# expensebot backend on :8000 — which is why Cloudflare was serving
# {"name":"ExpenseTracker"...} instead of this site. Declaring the hostname on
# 443 fixes the fallthrough.

server {
    listen 80;
    server_name swatithetravelqueen.codemaxdev.com;

    # ACME http-01 challenges must stay on plain HTTP and must not be cached.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/swatithetravelqueen;
        default_type "text/plain";
        try_files $uri =404;
    }

    root /var/www/swatithetravelqueen;
    index index.html;

    # Hashed build assets are immutable, so cache them hard.
    location /assets/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    # The document shell must never be cached, or a client pins a stale
    # index.html and keeps requesting asset hashes that no longer exist.
    # `expires -1` emits "Cache-Control: no-cache"; adding an explicit
    # add_header here would send the header twice.
    location = /index.html {
        expires -1;
    }

    # Client-side routing: /trips, /trips/kashmir and /booking are real routes
    # in the app but no files on disk, so fall back to the shell.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # gzip is on globally but gzip_types is not, so by default nginx only
    # compresses text/html. Scoped here rather than in nginx.conf so the other
    # live vhosts are unaffected.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    access_log /var/log/nginx/swatithetravelqueen.access.log;
    error_log  /var/log/nginx/swatithetravelqueen.error.log;
}

# HTTPS. Cloudflare connects here in Full/Strict mode; without this block the
# hostname matched no 443 server and inherited sid.sagarkapasi.com.
#
# HTTP/2 is enabled via the `http2` parameter on the listen directive because
# this is nginx 1.22.1; the standalone `http2 on;` directive needs 1.25.1+.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name swatithetravelqueen.codemaxdev.com;

    ssl_certificate     /etc/letsencrypt/live/swatithetravelqueen.codemaxdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swatithetravelqueen.codemaxdev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/swatithetravelqueen;
    index index.html;

    location /assets/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    access_log /var/log/nginx/swatithetravelqueen.access.log;
    error_log  /var/log/nginx/swatithetravelqueen.error.log;
}